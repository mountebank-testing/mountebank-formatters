version: 2.1

executors:
  node-active:
    docker:
      - image: cimg/node:24.19.0

jobs:
  pr:
    executor: node-active
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Lint & Test
          command: npm test
      - store_test_results:
          path: testResults
  build:
    executor: node-active
    steps:
      - checkout
      - run:
          name: Validate versions
          command: node -v && npm -v
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Lint & Test
          command: npm test
      - run:
          name: Version
          command: node tasks/version.js
      - run:
          name: Dist
          command: node tasks/dist.js
      - store_test_results:
          path: testResults
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - tasks
            - scripts
  deploy:
    executor: node-active
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish npm
          # Authenticates via an npm trusted publisher; the npm CLI exchanges the
          # OIDC token in NPM_ID_TOKEN for a short-lived publish token.
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            scripts/publishNpm
  release:
    executor: node-active
    environment:
      - MB_RELEASE: true
    steps:
      - setup_remote_docker:
          version: default
      - checkout
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Dist
          command: node tasks/dist.js
      - run:
          name: Publish npm
          # Authenticates via an npm trusted publisher; the npm CLI exchanges the
          # OIDC token in NPM_ID_TOKEN for a short-lived publish token.
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            scripts/publishNpm

workflows:
  version: 2
  pr:
    jobs:
      - pr:
          filters:
            branches:
              ignore: master
  pipeline:
    jobs:
      - build:
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
  release:
      jobs:
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/